name: Kiểm thử cài đặt MyKOS
on:
  push:
    branches: [main]
    paths: [.github/workflows/install-iso.yml]
  workflow_dispatch:
    inputs:
      desktop_run_id:
        description: Lượt kiểm thử desktop đã đạt và đã mở Calamares
        required: false
  workflow_run:
    workflows: [Kiểm thử khởi động ISO]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: mykos-install-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.validate.outputs.eligible }}
      iso_sha: ${{ steps.validate.outputs.iso_sha }}
      build_run_id: ${{ steps.build.outputs.run_id }}
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    steps:
      - name: Chọn đúng bằng chứng desktop
        id: desktop
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.desktop_run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          source_run_id="$SOURCE_RUN"
          if [[ -z "$source_run_id" ]]; then
            source_run_id=$(gh api --method GET "repos/$GH_REPO/actions/workflows/boot-iso.yml/runs" -f branch=main -f status=success -f per_page=1 --jq '.workflow_runs[0].id')
          fi
          [[ "$source_run_id" =~ ^[0-9]+$ ]]
          metadata=$(gh api "repos/$GH_REPO/actions/runs/$source_run_id")
          [[ $(jq -r '.conclusion' <<< "$metadata") == success ]]
          attempt=$(jq -r '.run_attempt' <<< "$metadata")
          printf 'run_id=%s\nartifact_name=mykos-boot-evidence-%s-%s\n' "$source_run_id" "$source_run_id" "$attempt" >> "$GITHUB_OUTPUT"
      - name: Tải bằng chứng nghiệm thu
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.desktop.outputs.run_id }}
          name: ${{ steps.desktop.outputs.artifact_name }}
          path: validation
      - name: Chỉ tiếp tục khi desktop và Calamares đã sẵn sàng
        id: validate
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          result = json.loads(Path('validation/desktop-test/result.json').read_text())
          installer = result.get('guest', {}).get('installer', {})
          eligible = result.get('status') == 'desktop-ready' and installer.get('running') is True and installer.get('ready') is True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              print('eligible=' + str(eligible).lower(), file=stream)
              if eligible:
                  sha = result['iso_sha256']
                  assert re.fullmatch('[0-9a-f]{64}', sha)
                  print('iso_sha=' + sha, file=stream)
                  run_id = str(result.get('source_build_run_id', ''))
                  if run_id:
                      assert re.fullmatch('[0-9]+', run_id)
                      print('build_run_id=' + run_id, file=stream)
                      artifact = result.get('source_artifact_name', '')
                      if artifact:
                          assert re.fullmatch('mykos-iso-amd64-' + run_id + '-[0-9]+', artifact)
                          print('tested_artifact=' + artifact, file=stream)
          print('Eligible for installer preview:', eligible)
          PYTHON
      - name: Xác định artifact ISO nguồn
        id: build
        if: steps.validate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED_BUILD_RUN: ${{ steps.validate.outputs.build_run_id }}
          TESTED_ARTIFACT: ${{ steps.validate.outputs.tested_artifact }}
        run: |
          set -euo pipefail
          if [[ -n "$TESTED_BUILD_RUN" ]]; then
            [[ "$TESTED_BUILD_RUN" =~ ^[0-9]+$ ]]
            metadata=$(gh api "repos/$GH_REPO/actions/runs/$TESTED_BUILD_RUN")
            [[ $(jq -r '.conclusion' <<< "$metadata") == success ]]
          else
            metadata=$(gh api --method GET "repos/$GH_REPO/actions/workflows/build-iso.yml/runs" -f branch=main -f status=success -f per_page=1 --jq '.workflow_runs[0]')
          fi
          run_id=$(jq -r '.id' <<< "$metadata")
          attempt=$(jq -r '.run_attempt' <<< "$metadata")
          [[ "$run_id" =~ ^[0-9]+$ ]]
          artifact="${TESTED_ARTIFACT:-mykos-iso-amd64-$run_id-$attempt}"
          [[ "$artifact" =~ ^mykos-iso-amd64-$run_id-[0-9]+$ ]]
          printf 'run_id=%s\nartifact_name=%s\n' "$run_id" "$artifact" >> "$GITHUB_OUTPUT"
  preview:
    name: Cài, boot và kiểm tra bản cài BIOS
    needs: source
    if: needs.source.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Chuẩn bị dung lượng trên runner tạm
        run: |
          set -euo pipefail
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux ]]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          fi
          df -h .
      - name: Tải ISO đúng mã đã nghiệm thu
        timeout-minutes: 10
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.build_run_id }}
          name: ${{ needs.source.outputs.artifact_name }}
          path: artifacts/source-iso
      - name: Cài công cụ máy ảo
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso python3-pil acl
          if [[ -c /dev/kvm ]]; then
            sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          fi
      - name: Cài Calamares và thử ứng dụng trong phiên đồ họa
        timeout-minutes: 50
        env:
          EXPECTED_ISO_SHA: ${{ needs.source.outputs.iso_sha }}
        run: |
          python3 scripts/testing/install_iso.py artifacts/source-iso/mykos-0.1.0-dev-amd64.iso --expected-sha "$EXPECTED_ISO_SHA" --output artifacts/install-test --prepare-install --install --boot-installed --smoke-installed --desktop-installed --multimedia-installed
      - name: Lưu bằng chứng, không tải lên đĩa ảo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mykos-install-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/install-test/**/*.json
            artifacts/install-test/**/*.log
            artifacts/install-test/**/*.png
            artifacts/install-test/installed-boot/audio-tone-evidence.wav
          if-no-files-found: warn
          retention-days: 7
