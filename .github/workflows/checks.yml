name: Configuration checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s tests/integration -v
      - name: Shell syntax
        run: |
          bash -n scripts/development/run-vm.sh
          sh -n distribution/image-build/010-mykos.chroot
      - name: Generate configuration with pinned Ubuntu toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build=3.0~a57-1ubuntu49.1 debootstrap
          python3 scripts/build/mykos.py configure build/ci-config
      - name: Check generated design exports
        run: python3 scripts/build/export-design.py --check
      - name: Install native Workspace test runtime
        run: python3 -m pip install -r desktop/workspace/requirements-dev.txt
      - name: Test native Workspace
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python3 -m unittest discover -s tests/desktop -v
      - name: Launch native Workspace smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          MYKOS_WORKSPACE_DATA: /tmp/mykos-ci-workspace
        run: python3 desktop/workspace/main.py --smoke-test
