name: Kiểm tra cấu hình và giao diện
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm thử công cụ tạo ảnh
        run: python3 -m unittest discover -s tests/integration -v
      - name: Kiểm tra cú pháp shell
        run: |
          bash -n scripts/development/run-vm.sh
          sh -n distribution/image-build/010-mykos.chroot
      - name: Tạo cấu hình bằng bộ công cụ Ubuntu đã chốt
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build=3.0~a57-1ubuntu49.1 debootstrap
          python3 scripts/build/mykos.py configure build/ci-config
      - name: Kiểm tra tài nguyên thiết kế đã xuất
        run: python3 scripts/build/export-design.py --check
      - name: Cài môi trường kiểm thử Workspace
        run: |
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0 fonts-noto-core
          python3 -m pip install -r desktop/workspace/requirements-dev.txt
      - name: Kiểm thử Workspace native
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python3 -m unittest discover -s tests/desktop -v
      - name: Khởi chạy Workspace không màn hình
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          MYKOS_WORKSPACE_DATA: /tmp/mykos-ci-workspace
        run: python3 desktop/workspace/main.py --smoke-test
