name: Đọc bằng chứng kiểm thử máy ảo
on:
  workflow_run:
    workflows: [Kiểm thử khởi động ISO, Kiểm thử cài đặt MyKOS, Chẩn đoán Calamares]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Kiểm tra có artifact bằng chứng
        id: available
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          ARTIFACT_NAME: ${{ github.event.workflow_run.name != 'Kiểm thử khởi động ISO' && format('mykos-install-evidence-{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) || format('mykos-boot-evidence-{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/artifacts" | jq --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name)] | length')
          if [[ "$count" -gt 0 ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'No evidence artifact: the preview may have been skipped or setup did not complete.'
          fi
      - name: Tải bằng chứng của đúng lượt kiểm thử
        if: steps.available.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: ${{ github.event.workflow_run.name != 'Kiểm thử khởi động ISO' && format('mykos-install-evidence-{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) || format('mykos-boot-evidence-{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) }}
          path: evidence
      - name: Xuất kết quả và ảnh để rà soát qua log
        if: steps.available.outputs.present == 'true'
        run: |
          python3 - <<'PYTHON'
          import base64
          import hashlib
          from pathlib import Path
          root = Path('evidence')
          for path in sorted(root.rglob('result.json')):
              print('MYKOS_RESULT ' + str(path.relative_to(root)))
              print(path.read_text())
          for path in sorted(root.rglob('serial.log')):
              print('MYKOS_CONSOLE_TAIL ' + str(path.relative_to(root)))
              print(path.read_text(errors='replace')[-6000:])
          for path in sorted(root.rglob('*.png')):
              data = path.read_bytes()
              # Giới hạn kích thước, không thực thi hoặc diễn giải nội dung ảnh.
              if len(data) > 1024 * 1024:
                  raise ValueError('Ảnh bằng chứng vượt 1 MiB: ' + str(path))
              encoded = base64.b64encode(data).decode('ascii')
              print('MYKOS_PNG_BEGIN ' + str(path.relative_to(root)) + ' ' + hashlib.sha256(data).hexdigest())
              for start in range(0, len(encoded), 4000):
                  print('MYKOS_PNG_DATA ' + encoded[start:start + 4000])
              print('MYKOS_PNG_END')
          PYTHON
