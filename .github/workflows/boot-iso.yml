name: Kiểm thử khởi động ISO
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Mã lượt tạo ISO có Artifacts còn hạn
        required: true
        default: '42392072303'
      artifact_name:
        description: Tên gói ISO của lượt tạo ảnh
        required: true
        default: mykos-iso-amd64-42392072303-1
  workflow_run:
    workflows: [Tạo ISO MyKOS]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: mykos-boot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  boot:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: BIOS và môi trường chạy trực tiếp
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Lấy công cụ kiểm thử
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tải ISO đã tạo thành công
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id || github.event.workflow_run.id }}
          name: ${{ inputs.artifact_name || format('mykos-iso-amd64-{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) }}
          path: artifacts/source-iso
      - name: Cài QEMU và công cụ đọc ISO
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso python3-pil
          qemu-system-x86_64 --version
      - name: Kiểm tra mã SHA-256
        working-directory: artifacts/source-iso
        run: sha256sum -c SHA256SUMS
      - name: Khởi động BIOS bằng QEMU
        timeout-minutes: 25
        run: |
          python3 scripts/testing/boot_iso.py artifacts/source-iso/mykos-0.1.0-dev-amd64.iso --output artifacts/boot-test --timeout 1200
      - name: Chuẩn bị bằng chứng kiểm thử
        if: always()
        run: |
          if test -f artifacts/boot-test/screen.ppm; then
            python3 -c 'from PIL import Image; Image.open("artifacts/boot-test/screen.ppm").save("artifacts/boot-test/screen.png")'
          fi
      - name: Lưu kết quả, nhật ký và ảnh màn hình
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mykos-boot-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/boot-test/*.json
            artifacts/boot-test/*.log
            artifacts/boot-test/*.cfg
            artifacts/boot-test/*.png
            artifacts/boot-test/*.ppm
          if-no-files-found: warn
          retention-days: 7
