name: Kiểm thử khởi động ISO
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Mã lượt tạo ISO có Artifacts còn hạn
        required: true
        default: '42443779141'
      artifact_name:
        description: Tên gói ISO của lượt tạo ảnh
        required: true
        default: mykos-iso-amd64-42443779141-1
  push:
    branches: [main]
    paths:
      - .github/workflows/boot-iso.yml
      - scripts/testing/**
  workflow_run:
    workflows: [Tạo ISO MyKOS]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: mykos-boot-${{ github.ref }}
  # Máy kiểm thử không gắn đĩa cài đặt; ưu tiên công cụ/ISO mới nhất.
  cancel-in-progress: true
jobs:
  boot:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: BIOS và môi trường chạy trực tiếp
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Lấy công cụ kiểm thử
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Xác định ISO nguồn đã build thành công
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_RUN: ${{ inputs.build_run_id }}
          INPUT_ARTIFACT: ${{ inputs.artifact_name }}
          EVENT_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          source_run_id="${INPUT_RUN:-${EVENT_RUN:-}}"
          if [[ -z "$source_run_id" ]]; then
            source_run_id=$(gh api --method GET "repos/$GH_REPO/actions/workflows/build-iso.yml/runs" -f branch=main -f status=success -f per_page=1 --jq '.workflow_runs[0].id')
          fi
          [[ "$source_run_id" =~ ^[0-9]+$ ]]
          metadata=$(gh api "repos/$GH_REPO/actions/runs/$source_run_id")
          [[ $(jq -r '.conclusion' <<< "$metadata") == success ]]
          source_attempt=$(jq -r '.run_attempt' <<< "$metadata")
          source_sha=$(jq -r '.head_sha' <<< "$metadata")
          source_artifact="${INPUT_ARTIFACT:-mykos-iso-amd64-$source_run_id-$source_attempt}"
          [[ "$source_artifact" =~ ^[a-zA-Z0-9._-]+$ ]]
          printf 'run_id=%s\nartifact_name=%s\nsource_sha=%s\n' "$source_run_id" "$source_artifact" "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'ISO source: run %s, commit %s, artifact %s\n' "$source_run_id" "$source_sha" "$source_artifact"
      - name: Tải ISO đã tạo thành công
        timeout-minutes: 10
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: ${{ steps.source.outputs.artifact_name }}
          path: artifacts/source-iso
      - name: Cài QEMU và công cụ đọc ISO
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso python3-pil acl
          qemu-system-x86_64 --version
      - name: Kiểm tra tăng tốc KVM trên runner dùng riêng
        run: |
          set -euo pipefail
          if [[ -c /dev/kvm ]]; then
            # Chỉ cấp cho UID hiện tại trên máy tạm, không chmod toàn cục.
            sudo setfacl -m "u:$(id -u):rw" /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
            echo 'KVM device available to the current runner user'
          else
            echo 'No KVM device; probes will use TCG'
          fi
      - name: Kiểm tra mã SHA-256
        working-directory: artifacts/source-iso
        run: sha256sum -c SHA256SUMS
      - name: Khởi động BIOS bằng QEMU
        timeout-minutes: 25
        run: |
          python3 scripts/testing/boot_iso.py artifacts/source-iso/mykos-0.1.0-dev-amd64.iso --output artifacts/boot-test --timeout 1200
      - name: Kiểm tra phiên Plasma và mở ứng dụng
        timeout-minutes: 25
        run: |
          python3 scripts/testing/probe_desktop.py artifacts/source-iso/mykos-0.1.0-dev-amd64.iso --output artifacts/desktop-test --timeout 1200 --software-rendering
      - name: Chuẩn bị bằng chứng kiểm thử
        if: always()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from PIL import Image
          for path in Path('artifacts').glob('*-test/*.ppm'):
              Image.open(path).save(path.with_suffix('.png'))
          PYTHON
      - name: Lưu kết quả, nhật ký và ảnh màn hình
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mykos-boot-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/boot-test/*.json
            artifacts/boot-test/*.log
            artifacts/boot-test/*.cfg
            artifacts/boot-test/*.png
            artifacts/boot-test/*.ppm
            artifacts/desktop-test/*.json
            artifacts/desktop-test/*.log
            artifacts/desktop-test/*.cfg
            artifacts/desktop-test/*.png
            artifacts/desktop-test/*.ppm
          if-no-files-found: warn
          retention-days: 7
