name: Chẩn đoán Calamares
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-calamares.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tải ISO nguồn để chẩn đoán launcher
        timeout-minutes: 10
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42484136362
          name: mykos-iso-amd64-42484136362-1
          path: artifacts/source-iso
      - name: Cài công cụ
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso python3-pil acl
          if [[ -c /dev/kvm ]]; then sudo setfacl -m "u:$(id -u):rw" /dev/kvm; fi
      - name: Chẩn đoán bố cục root đến Summary, chưa ghi phân vùng
        run: |
          python3 scripts/testing/install_iso.py artifacts/source-iso/mykos-0.1.0-dev-amd64.iso --expected-sha 336e46b66e9596e67461c519c8ed565fc64c66213f617d6901ea2fe6a443f06f --output artifacts/install-test --diagnostic-direct --diagnostic-overlay distribution/installer/overlay --prepare-install
      - name: Lưu bằng chứng chẩn đoán
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mykos-install-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/install-test/*.json
            artifacts/install-test/*.log
            artifacts/install-test/*.png
          retention-days: 7
