{
  "modules-search": [
    "/usr/share/mykos/calamares/modules",
    "local"
  ],
  "branding": "mykos",
  "prompt-install": true,
  "dont-chroot": false,
  "oem-setup": false,
  "disable-cancel": false,
  "disable-cancel-during-exec": false,
  "hide-back-and-next-during-exec": true,
  "sequence": [
    {
      "show": [
        "welcome",
        "locale",
        "keyboard",
        "partition",
        "users",
        "summary"
      ]
    },
    {
      "exec": [
        "partition",
        "mount",
        "unpackfs",
        "machineid",
        "fstab",
        "locale",
        "keyboard",
        "localecfg",
        "users",
        "displaymanager",
        "networkcfg",
        "hwclock",
        "services-systemd",
        "packages",
        "mykos-config",
        "initramfs",
        "grubcfg",
        "bootloader",
        "umount"
      ]
    },
    {
      "show": [
        "finished"
      ]
    }
  ],
  "quit-at-end": true
}
