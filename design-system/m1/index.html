<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyKOS M1 — Desktop</title><link rel="stylesheet" href="review.css"></head>
<body data-theme="dark">
<main id="desktop" aria-label="Màn hình làm việc MyKOS">
<svg class="wallpaper" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g class="wallpaper-mark" transform="translate(584 284) scale(18)"><path d="M4 20V4l8 8 8-8v16M4 12l8 8 8-8"/></g></svg>
<section id="appWindow" class="window" aria-labelledby="windowTitle" hidden>
<header class="titlebar" id="titlebar"><span id="windowTitle">Tệp</span><div class="window-actions"><button id="minimize" aria-label="Thu nhỏ">─</button><button id="maximize" aria-label="Phóng to">□</button><button id="closeWindow" aria-label="Đóng">×</button></div></header>
<div id="filesView"><div class="file-toolbar"><button id="back" aria-label="Quay về thư mục cá nhân">‹</button><div class="breadcrumb" id="breadcrumb">Thư mục cá nhân</div><input id="fileSearch" type="search" placeholder="Tìm trong thư mục…" aria-label="Tìm trong thư mục"></div><div class="file-layout"><nav class="places" aria-label="Vị trí"><button data-folder="home" aria-current="page">Thư mục cá nhân</button><button data-folder="documents">Tài liệu</button><button data-folder="downloads">Tải xuống</button><button data-folder="pictures">Hình ảnh</button><hr><button data-folder="trash">Thùng rác</button></nav><div class="file-content"><div class="file-columns"><span>Tên</span><span>Loại</span><span>Kích thước</span></div><div id="fileList"></div><p id="emptyFiles" hidden>Thư mục trống</p></div></div><footer class="statusbar" id="fileCount">6 mục</footer></div>
<div id="settingsView" hidden><div class="settings-layout"><nav class="places" aria-label="Nhóm thiết lập"><button aria-current="page">Giao diện</button></nav><div class="settings-content"><h1>Giao diện</h1><section class="setting-row"><label>Sắc thái</label><div class="theme-options"><button data-theme-choice="dark" aria-pressed="true"><span class="theme-swatch ink"></span>Tối</button><button data-theme-choice="light" aria-pressed="false"><span class="theme-swatch paper"></span>Sáng</button></div></section><section class="setting-row"><label>Biểu tượng</label><span>MyKOS Fold</span></section><section class="setting-row"><label>Chữ</label><span>Noto Sans · 14</span></section><section class="setting-row"><label for="reducedMotion">Giảm chuyển động</label><input id="reducedMotion" type="checkbox"></section></div></div></div>
<div id="simpleView" class="simple-content" hidden></div>
</section>
<section id="notifications" class="popup notifications" aria-label="Thông báo" hidden><header><h2>Thông báo</h2><button id="closeNotifications" aria-label="Đóng thông báo">×</button></header><p class="empty-notifications">Không có thông báo</p></section>
<section id="sound" class="popup sound" aria-label="Âm lượng minh họa" hidden><label for="volume">Âm lượng</label><input id="volume" type="range" min="0" max="100" value="60"><output id="volumeValue" for="volume">60%</output></section>
<section id="login" class="login" aria-labelledby="loginName" hidden><form id="loginForm"><div class="avatar" aria-hidden="true">N</div><h1 id="loginName">Người dùng</h1><label class="sr-only" for="password">Mật khẩu minh họa</label><input id="password" type="password" autocomplete="off" placeholder="Mật khẩu minh họa"><button type="submit" class="primary">Đăng nhập</button><p id="loginMessage" role="status"></p></form></section>
<footer id="panel" class="panel"><button id="launcherButton" class="launcher-button" aria-label="Mở ứng dụng" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4l8 8 8-8v16M4 12l8 8 8-8"/></svg></button><span class="separator"></span><div id="tasks" class="tasks"><button data-app="files" aria-label="Tệp"><img src="../assets/app-icons/files.svg" alt=""></button><button data-app="browser" aria-label="Trình duyệt"><img src="../assets/app-icons/browser.svg" alt=""></button><button data-app="settings" aria-label="Thiết lập"><img src="../assets/app-icons/settings.svg" alt=""></button></div><span class="panel-space"></span><button id="soundButton" aria-label="Âm lượng" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="../assets/icons/sprite.svg#volume"/></svg></button><button id="notificationsButton" aria-label="Thông báo" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="../assets/icons/sprite.svg#mail"/></svg></button><button id="clock" class="clock" aria-label="Ngày giờ"><span>09:41</span><small>08/11/2026</small></button><button id="showDesktop" class="show-desktop" aria-label="Hiện màn hình làm việc"></button></footer>
</main>
<dialog id="launcher" aria-labelledby="launcherTitle"><header><h2 id="launcherTitle" class="sr-only">Ứng dụng</h2><input id="appSearch" type="search" placeholder="Tìm ứng dụng…" aria-label="Tìm ứng dụng"><button id="closeLauncher" aria-label="Đóng menu">×</button></header><div class="launcher-heading"><span id="listTitle">Đã ghim</span><button id="allApps">Tất cả ứng dụng</button></div><div id="appList" class="app-list"></div><p id="emptySearch" hidden>Không tìm thấy ứng dụng</p><footer><span>Người dùng</span><button id="lock" aria-label="Khóa màn hình"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="../assets/icons/sprite.svg#lock"/></svg></button></footer></dialog>
<aside id="reviewTools" class="review-tools" aria-label="Công cụ xem thiết kế" hidden><strong>Bản mẫu M1</strong><span>Không thay đổi máy. Không nhập mật khẩu thật.</span><button data-review="desktop">Desktop</button><button data-review="files">Tệp</button><button data-review="launcher">Ứng dụng</button><button data-review="settings">Thiết lập</button><button data-review="login">Đăng nhập</button><button id="hideReview">Đóng · F1</button></aside>
<script src="review.js"></script></body></html>
